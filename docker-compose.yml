version: '3.8'

services:
  frontend:
    build:
      context: .
    container_name: frontend
    ports:
      - "8003:8003"
    volumes:
      - .:/var/www
    depends_on:
      - auth-api
      - tareas-api
      - historial-api
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8003
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8003"
